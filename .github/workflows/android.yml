name: Android APK (beta)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: node prepare-web.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Apply Sovereign icons, splash and sounds
        run: |
          RES=android/app/src/main/res
          rm -f $RES/drawable*/splash.png
          cp -R res/. $RES/
          # Native background audio: foreground media service, media notification,
          # and the plugin that connects them to the app (replaces MainActivity).
          JAVA=android/app/src/main/java/com/themidoriway/sovereign
          ls $JAVA
          cp native/*.java $JAVA/
          # Permissions (exact reminder timing, background audio) and the service entry
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -n "permission\|service" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Set version
        run: |
          VER=$(node -p "require('../extension/manifest.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Load the private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sovereign-release.p12"
          echo "SOV_KEYSTORE=$RUNNER_TEMP/sovereign-release.p12" >> $GITHUB_ENV
          python3 native/sign_gradle.py android/app/build.gradle

      - name: Build signed APK
        working-directory: android-build/android
        env:
          SOV_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs "$APK" | grep -E "DN|SHA-256"
          cp "$APK" "Sovereign-$VER.apk"
          rm -f "$SOV_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: Sovereign-${{ env.VER }}-apk
          path: android-build/Sovereign-*.apk

      - name: Publish to the beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta "Sovereign-$VER.apk" --target ${{ github.sha }} --prerelease --title "Sovereign $VER (beta, build ${{ github.run_number }})" \
            --notes "Personal beta build for Android. Download the APK on your phone and open it to install. Built from ${{ github.sha }}."
