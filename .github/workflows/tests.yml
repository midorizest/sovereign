name: Checks

# Runs on every push to a branch and on pull requests. Pushes to main run the
# same checks from the Android workflow, which only builds the APK if they pass.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version and file lists agree
        run: python3 tools/release.py

      - name: Install the test browser
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test the app
        working-directory: tests
        run: npm test
