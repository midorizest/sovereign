<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Sovereign Library</title>
<link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
  <!-- Shelf -->
  <main id="shelf" class="shelf" aria-labelledby="shelf-title">
    <header class="shelf-head">
      <button class="icon-btn" id="shelf-back" aria-label="Back to Sovereign" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <p class="eyebrow">Sovereign Series</p>
      <h1 id="shelf-title">Library</h1>
      <p class="lede">Your printables, kept inside the app. Tap to open, fill in as you go. Everything saves on this device.</p>
    </header>
    <section id="for-you" class="shelf-section">
      <h2 class="eyebrow">For you</h2>
      <div class="grid" id="grid-mine"></div>
    </section>
    <section id="also" class="shelf-section">
      <h2 class="eyebrow">Also in the library</h2>
      <div class="grid" id="grid-other"></div>
    </section>
    <p class="fine">Your entries never leave this phone. Use “Save a copy” inside a book to keep a filled PDF somewhere else.</p>
  </main>

  <!-- Reader -->
  <section id="reader" class="reader" hidden aria-label="Reader">
    <header class="reader-bar">
      <button class="icon-btn" id="btn-close" aria-label="Back to library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="reader-title">
        <span id="r-title"></span>
        <span id="r-status" class="status" aria-live="polite"></span>
      </div>
      <button class="icon-btn" id="btn-menu" aria-label="More" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" id="m-contents">Contents</button>
        <button role="menuitem" id="m-save">Save a copy</button>
        <button role="menuitem" id="m-reset" class="danger">Start fresh</button>
      </div>
    </header>
    <div id="viewerContainer" class="viewer-wrap" tabindex="0">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <footer class="reader-foot">
      <button class="pill" id="btn-prev" aria-label="Previous page">‹</button>
      <span class="page-ind"><span id="r-page">1</span> / <span id="r-pages">–</span></span>
      <button class="pill" id="btn-next" aria-label="Next page">›</button>
      <span class="spacer"></span>
      <button class="pill" id="btn-zoomout" aria-label="Zoom out">−</button>
      <button class="pill" id="btn-zoomin" aria-label="Zoom in">+</button>
    </footer>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="library.js"></script>
</body>
</html>
